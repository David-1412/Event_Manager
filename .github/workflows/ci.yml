# CI gates every push/PR on the same checks `npm run verify` runs locally, then
# builds both container images. Images are pushed to GHCR only on the main
# branch: a pull request still gets a full build (so a broken Dockerfile fails
# the check) but never receives registry credentials, which keeps them
# unavailable to workflows from forks.
#
# Deploy reads those images from GHCR and updates the production Compose stack
# on the VPS after smoke tests pass. The production environment supplies the SSH
# host, user, key, and known-hosts secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci` rather than `install` so a package.json that has drifted from the
      # committed lock file fails here instead of silently resolving new versions.
      - run: npm ci

      # check:encoding, type-check, lint, vitest, next build.
      - name: Verify
        run: npm run verify

      # Keep critical advisories blocking while allowing moderate/high findings
      # to be reported without failing CI. Do not mask the audit command: critical
      # findings must still fail this job.
      - name: Audit dependencies
        run: npm audit --audit-level=critical

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # global.json is intentionally absent: the projects target net8.0 and
      # `dotnet build` picks the newest installed SDK to compile them with.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Lock files are committed and RestorePackagesWithLockFile is on, so
      # --locked-mode proves the graph has not drifted from what is committed.
      - name: Restore
        run: dotnet restore SportMeet.slnx --locked-mode

      - name: Build
        run: dotnet build SportMeet.slnx -c Release --no-restore

      # No backend test project exists yet (SportMeet.slnx contains only the four
      # src projects), so there is nothing for `dotnet test` to run here. When one
      # is added, put it in the solution and re-enable:
      #   dotnet test SportMeet.slnx -c Release --no-build

  # Builds both images with the registry/cache configuration the repo relies on,
  # then publishes them on main. `docker buildx bake` reads docker-compose.yml, so
  # CI builds exactly what `docker compose up --build` builds locally. The image
  # names come from the API_IMAGE/WEB_IMAGE variables the compose file declares,
  # so CI and the deploy host agree on one name rather than guessing tags.
  images:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image names
        id: image-names
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "api_image=ghcr.io/$owner/sportmeet-api" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/$owner/sportmeet-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: `latest` plus the commit SHA, so a deploy can pin an exact build.
      - name: Build and push
        uses: docker/bake-action@v6
        env:
          API_IMAGE: ${{ steps.image-names.outputs.api_image }}
          WEB_IMAGE: ${{ steps.image-names.outputs.web_image }}
        with:
          files: docker-compose.yml
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            api.tags=${{ steps.image-names.outputs.api_image }}:latest
            api.tags=${{ steps.image-names.outputs.api_image }}:${{ github.sha }}
            web.tags=${{ steps.image-names.outputs.web_image }}:latest
            web.tags=${{ steps.image-names.outputs.web_image }}:${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' }}

      # Records what was produced so a failed deploy is traceable to a build.
      - name: Report image tags
        if: github.ref == 'refs/heads/main'
        env:
          API_IMAGE: ${{ steps.image-names.outputs.api_image }}
          WEB_IMAGE: ${{ steps.image-names.outputs.web_image }}
        run: |
          echo "Pushed:"
          echo "  $API_IMAGE:latest and :$GITHUB_SHA"
          echo "  $WEB_IMAGE:latest and :$GITHUB_SHA"

  # Gate for the publish step: the published images must actually run, talk to
  # postgres, and serve the frontend before anything ships. This catches a bad
  # image that `dotnet build` and `next build` cannot.
  smoke:
    runs-on: ubuntu-latest
    needs: [images]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image names
        id: image-names
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "api_image=ghcr.io/$owner/sportmeet-api" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/$owner/sportmeet-web" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pulls rather than builds, so what gets tested is the artifact CI produced.
      - name: Run stack from published images
        env:
          API_IMAGE: ${{ steps.image-names.outputs.api_image }}
          WEB_IMAGE: ${{ steps.image-names.outputs.web_image }}
        run: |
          docker compose pull api web
          docker compose up -d --wait --wait-timeout 180 || {
            docker compose ps
            docker compose logs api web
            exit 1
          }
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:5000/healthz; then ok=1; break; fi
            echo "waiting for api ($i/36)"; sleep 5
          done
          [ "${ok:-}" = 1 ] || { docker compose logs api web; exit 1; }
          docker compose ps

      # Exercises the DB path: /api/events returns a paged envelope, so this
      # proves migrations and seed data ran against postgres. The field names are
      # the real contract: {"items":[{"title":"Netball Tuesday",...}]}
      - name: Check API data
        run: |
          body=$(curl -fsS http://localhost:5000/api/events)
          echo "$body" | head -c 400
          echo "$body" | grep -q '"items"' || { echo "no items envelope"; exit 1; }
          echo "$body" | grep -q '"title"' || { echo "no seeded events in response"; exit 1; }

      # Proves the frontend serves. The API origin is read from
      # NEXT_PUBLIC_API_BASE_URL at runtime inside the bundle rather than appearing
      # in the HTML shell, so this checks the page renders, not the origin string.
      - name: Check web serving
        run: |
          html=$(curl -fsS http://localhost:3000)
          echo "$html" | grep -qi '<html' || { echo "web did not serve HTML"; exit 1; }
          echo "web served $(echo "$html" | wc -c) bytes of HTML"

  deploy:
    runs-on: ubuntu-latest
    needs: [smoke]
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/docker/Monafy' }}
    steps:
      - name: Normalize image names
        id: image-names
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "api_image=ghcr.io/$owner/sportmeet-api" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/$owner/sportmeet-web" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          API_IMAGE: ${{ steps.image-names.outputs.api_image }}
          WEB_IMAGE: ${{ steps.image-names.outputs.web_image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -Eeuo pipefail

          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the $name secret in the production environment."
              exit 1
            fi
          done

          keyfile="$RUNNER_TEMP/Monafy-deploy-key"
          known_hosts_file="$RUNNER_TEMP/Monafy-known-hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$keyfile"
          chmod 600 "$keyfile"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"

          ssh_options=(
            -T
            -p "$DEPLOY_PORT"
            -i "$keyfile"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
          )
          target="$DEPLOY_USER@$DEPLOY_HOST"
          cleanup() {
            ssh "${ssh_options[@]}" "$target" "docker logout ghcr.io" >/dev/null 2>&1 || true
            rm -f "$keyfile" "$known_hosts_file"
          }
          trap cleanup EXIT

          printf '%s' "$GHCR_TOKEN" |
            ssh "${ssh_options[@]}" "$target" \
              "docker login ghcr.io --username $(printf '%q' "$GHCR_USER") --password-stdin"

          remote_command="bash -s -- $(printf '%q' "$API_IMAGE:$GITHUB_SHA") $(printf '%q' "$WEB_IMAGE:$GITHUB_SHA") $(printf '%q' "$DEPLOY_PATH")"
          ssh "${ssh_options[@]}" "$target" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          api_image="$1"
          web_image="$2"
          deploy_path="$3"
          cd "$deploy_path"
          [[ -f docker-compose.yml ]] || { echo "docker-compose.yml not found in $deploy_path" >&2; exit 1; }
          export API_IMAGE="$api_image" WEB_IMAGE="$web_image"
          docker compose pull api web
          docker compose up -d --wait --wait-timeout 180
          docker compose ps
          REMOTE
